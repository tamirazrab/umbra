global:
  scrape_interval: 15s # Default is every 1 minute.

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
